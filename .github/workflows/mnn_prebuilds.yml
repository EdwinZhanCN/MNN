name: Build MNN Prebuilts

on:
    push:
        tags:
            - "*-lumnn*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag/version/ref to build, e.g. 3.5.0-lumnn.llm.omni"
                required: false
                type: string

permissions:
    contents: write

env:
    BASE_CMAKE_ARGS: >-
        -DMNN_SEP_BUILD=OFF
        -DMNN_BUILD_LLM=ON
        -DMNN_BUILD_LLM_OMNI=ON
        -DMNN_BUILD_OPENCV=ON
        -DMNN_IMGCODECS=ON
        -DMNN_BUILD_AUDIO=ON
        -DMNN_LOW_MEMORY=ON
        -DMNN_SUPPORT_TRANSFORMER_FUSE=ON
        -DMNN_SUPPORT_BF16=ON
        -DMNN_BUILD_TOOLS=OFF
        -DMNN_BUILD_DEMO=OFF
        -DMNN_BUILD_TEST=OFF
        -DMNN_BUILD_BENCHMARK=OFF
        -DMNN_BUILD_QUANTOOLS=OFF
        -DMNN_BUILD_CONVERTER=OFF
        -DMNN_PORTABLE_BUILD=ON
        -DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON
        -DMNN_OPENCL=ON
        -DMNN_VULKAN=ON

jobs:
    setup:
        runs-on: ubuntu-latest
        outputs:
            VERSION: ${{ steps.get_version.outputs.VERSION }}
            CHECKOUT_REF: ${{ steps.get_version.outputs.CHECKOUT_REF }}
            IS_RELEASE: ${{ steps.get_version.outputs.IS_RELEASE }}
        steps:
            - name: Get version and checkout ref
              id: get_version
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
                    echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
                    echo "CHECKOUT_REF=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
                    echo "IS_RELEASE=true" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                    echo "CHECKOUT_REF=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                    echo "IS_RELEASE=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                    echo "CHECKOUT_REF=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                    echo "IS_RELEASE=false" >> "$GITHUB_OUTPUT"
                  fi

    linux-x86_64:
        needs: [setup]
        runs-on: ubuntu-latest
        env:
            PACKAGE: mnn-${{ needs.setup.outputs.VERSION }}-linux-x86_64
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  ref: ${{ needs.setup.outputs.CHECKOUT_REF }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential \
                    cmake \
                    ninja-build \
                    ocl-icd-opencl-dev \
                    opencl-headers \
                    zlib1g-dev \
                    libjpeg-dev \
                    libpng-dev

            - name: Setup Vulkan SDK
              uses: humbletim/setup-vulkan-sdk@v1.2.1
              with:
                  vulkan-query-version: "1.4.350.0"
                  vulkan-use-cache: true

            - name: Build dynamic
              run: |
                  cmake -S . -B build-dynamic -G Ninja \
                    ${{ env.BASE_CMAKE_ARGS }} \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DMNN_BUILD_SHARED_LIBS=ON \
                    -DMNN_USE_SSE=ON

                  cmake --build build-dynamic --config Release --parallel

            - name: Package
              shell: bash
              run: |
                  set -euxo pipefail

                  mkdir -p "${PACKAGE}/lib" "${PACKAGE}/include" "${PACKAGE}/licenses"

                  cp build-dynamic/libMNN.so "${PACKAGE}/lib/"
                  cp -r include/MNN "${PACKAGE}/include/"

                  if [[ -d transformers/llm/engine/include/llm ]]; then
                    mkdir -p "${PACKAGE}/include/MNN"
                    cp -r transformers/llm/engine/include/llm "${PACKAGE}/include/MNN/"
                  fi

                  # MNN_SEP_BUILD=OFF may not emit separate libllm / MNN_Express libraries.
                  # Package them if present, but do not fail if they are absent.
                  find build-dynamic -name 'libllm.so' -exec cp {} "${PACKAGE}/lib/" \; -quit || true
                  find build-dynamic -name 'libMNN_Express.so' -exec cp {} "${PACKAGE}/lib/" \; -quit || true

                  test -f "${PACKAGE}/include/MNN/llm/llm.hpp"
                  test -f "${PACKAGE}/lib/libMNN.so"

                  if [[ -f LICENSE ]]; then
                    cp LICENSE "${PACKAGE}/licenses/MNN-LICENSE.txt"
                  fi

                  cat > "${PACKAGE}/metadata.json" <<EOF
                  {
                    "name": "MNN",
                    "version": "${{ needs.setup.outputs.VERSION }}",
                    "checkout_ref": "${{ needs.setup.outputs.CHECKOUT_REF }}",
                    "commit": "${{ github.sha }}",
                    "target": "linux-x86_64",
                    "arch": "x86_64",
                    "os": "linux",
                    "linkage": ["dynamic"],
                    "separate_build": false,
                    "backends": ["cpu", "opencl", "vulkan"],
                    "features": ["llm", "llm-omni", "vision", "audio", "bf16"],
                    "cmake": {
                      "MNN_BUILD_SHARED_LIBS": "ON",
                      "MNN_SEP_BUILD": "OFF",
                      "MNN_BUILD_LLM": "ON",
                      "MNN_BUILD_LLM_OMNI": "ON"
                    }
                  }
                  EOF

                  echo "Packaged libraries:"
                  find "${PACKAGE}/lib" -maxdepth 1 -type f -print

                  echo "Dynamic library dependencies:"
                  ldd "${PACKAGE}/lib/libMNN.so" || true
                  if [[ -f "${PACKAGE}/lib/libllm.so" ]]; then
                    ldd "${PACKAGE}/lib/libllm.so" || true
                  fi
                  if [[ -f "${PACKAGE}/lib/libMNN_Express.so" ]]; then
                    ldd "${PACKAGE}/lib/libMNN_Express.so" || true
                  fi

                  tar czf "${PACKAGE}.tar.gz" "${PACKAGE}"

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.PACKAGE }}
                  path: ${{ env.PACKAGE }}.tar.gz
    linux-aarch64:
        needs: [setup]
        runs-on: ubuntu-24.04-arm
        env:
            PACKAGE: mnn-${{ needs.setup.outputs.VERSION }}-linux-aarch64
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  ref: ${{ needs.setup.outputs.CHECKOUT_REF }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential \
                      cmake \
                      ninja-build \
                      ocl-icd-opencl-dev \
                      opencl-headers \
                      libvulkan-dev \
                      zlib1g-dev \
                      libjpeg-dev \
                      libpng-dev

            - name: Build dynamic
              run: |
                  cmake -S . -B build-dynamic -G Ninja \
                      ${{ env.BASE_CMAKE_ARGS }} \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DMNN_BUILD_SHARED_LIBS=ON \
                      -DMNN_USE_SSE=OFF \
                      -DMNN_ARM82=ON

                  cmake --build build-dynamic --config Release --parallel

            - name: Package
              shell: bash
              run: |
                  set -euxo pipefail

                  mkdir -p "${PACKAGE}/lib" "${PACKAGE}/include" "${PACKAGE}/licenses"

                  cp build-dynamic/libMNN.so "${PACKAGE}/lib/"
                  cp -r include/MNN "${PACKAGE}/include/"

                  if [[ -d transformers/llm/engine/include/llm ]]; then
                      mkdir -p "${PACKAGE}/include/MNN"
                      cp -r transformers/llm/engine/include/llm "${PACKAGE}/include/MNN/"
                  fi

                  # MNN_SEP_BUILD=OFF may not emit separate libllm / MNN_Express libraries.
                  # Package them if present, but do not fail if they are absent.
                  find build-dynamic -name 'libllm.so' -exec cp {} "${PACKAGE}/lib/" \; -quit || true
                  find build-dynamic -name 'libMNN_Express.so' -exec cp {} "${PACKAGE}/lib/" \; -quit || true

                  test -f "${PACKAGE}/include/MNN/llm/llm.hpp"
                  test -f "${PACKAGE}/lib/libMNN.so"

                  if [[ -f LICENSE ]]; then
                      cp LICENSE "${PACKAGE}/licenses/MNN-LICENSE.txt"
                  fi

                  cat > "${PACKAGE}/metadata.json" <<EOF
                  {
                      "name": "MNN",
                      "version": "${{ needs.setup.outputs.VERSION }}",
                      "checkout_ref": "${{ needs.setup.outputs.CHECKOUT_REF }}",
                      "commit": "${{ github.sha }}",
                      "target": "linux-aarch64",
                      "arch": "aarch64",
                      "os": "linux",
                      "linkage": ["dynamic"],
                      "separate_build": false,
                      "backends": ["cpu", "opencl", "vulkan"],
                      "features": ["llm", "llm-omni", "vision", "audio", "bf16", "arm82"],
                      "cmake": {
                      "MNN_BUILD_SHARED_LIBS": "ON",
                      "MNN_SEP_BUILD": "OFF",
                      "MNN_BUILD_LLM": "ON",
                      "MNN_BUILD_LLM_OMNI": "ON",
                      "MNN_ARM82": "ON",
                      "MNN_USE_SSE": "OFF"
                      }
                  }
                  EOF

                  echo "Packaged libraries:"
                  find "${PACKAGE}/lib" -maxdepth 1 -type f -print

                  echo "Dynamic library dependencies:"
                  ldd "${PACKAGE}/lib/libMNN.so" || true
                  if [[ -f "${PACKAGE}/lib/libllm.so" ]]; then
                      ldd "${PACKAGE}/lib/libllm.so" || true
                  fi
                  if [[ -f "${PACKAGE}/lib/libMNN_Express.so" ]]; then
                      ldd "${PACKAGE}/lib/libMNN_Express.so" || true
                  fi

                  tar czf "${PACKAGE}.tar.gz" "${PACKAGE}"

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.PACKAGE }}
                  path: ${{ env.PACKAGE }}.tar.gz

    windows-x86_64:
        needs: [setup]
        runs-on: windows-latest
        env:
            PACKAGE: mnn-${{ needs.setup.outputs.VERSION }}-windows-x86_64
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  ref: ${{ needs.setup.outputs.CHECKOUT_REF }}

            - uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Setup Vulkan SDK
              uses: humbletim/setup-vulkan-sdk@v1.2.1
              with:
                  vulkan-query-version: "1.4.350.0"
                  vulkan-use-cache: true

            - name: Setup Ninja
              uses: seanmiddleditch/gha-setup-ninja@v5

            - name: Build dynamic MT
              shell: pwsh
              run: |
                  cmake -S . -B build-dynamic -G Ninja `
                    ${{ env.BASE_CMAKE_ARGS }} `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DMNN_BUILD_SHARED_LIBS=ON `
                    -DMNN_WIN_RUNTIME_MT=ON `
                    -DMNN_USE_SSE=ON

                  cmake --build build-dynamic --config Release --parallel

            - name: Package
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path "${{ env.PACKAGE }}/lib" | Out-Null
                  New-Item -ItemType Directory -Force -Path "${{ env.PACKAGE }}/include" | Out-Null
                  New-Item -ItemType Directory -Force -Path "${{ env.PACKAGE }}/licenses" | Out-Null

                  Copy-Item build-dynamic/MNN.lib "${{ env.PACKAGE }}/lib/MNN.lib"
                  Copy-Item build-dynamic/MNN.dll "${{ env.PACKAGE }}/lib/MNN.dll"
                  Copy-Item -Recurse include/MNN "${{ env.PACKAGE }}/include/"

                  # Import libraries / DLLs from dynamic build.
                  # With MNN_SEP_BUILD=OFF, these may or may not exist separately.
                  Get-ChildItem build-dynamic -Recurse -Filter llm.lib | Select-Object -First 1 | ForEach-Object {
                    Copy-Item $_.FullName "${{ env.PACKAGE }}/lib/llm.lib"
                  }
                  Get-ChildItem build-dynamic -Recurse -Filter llm.dll | Select-Object -First 1 | ForEach-Object {
                    Copy-Item $_.FullName "${{ env.PACKAGE }}/lib/llm.dll"
                  }
                  Get-ChildItem build-dynamic -Recurse -Filter MNN_Express.lib | Select-Object -First 1 | ForEach-Object {
                    Copy-Item $_.FullName "${{ env.PACKAGE }}/lib/MNN_Express.lib"
                  }
                  Get-ChildItem build-dynamic -Recurse -Filter MNN_Express.dll | Select-Object -First 1 | ForEach-Object {
                    Copy-Item $_.FullName "${{ env.PACKAGE }}/lib/MNN_Express.dll"
                  }

                  if (Test-Path transformers/llm/engine/include/llm) {
                    New-Item -ItemType Directory -Force -Path "${{ env.PACKAGE }}/include/MNN" | Out-Null
                    Copy-Item -Recurse transformers/llm/engine/include/llm "${{ env.PACKAGE }}/include/MNN/"
                  }

                  if (!(Test-Path "${{ env.PACKAGE }}/include/MNN/llm/llm.hpp")) {
                    throw "Missing packaged MNN LLM headers"
                  }
                  if (!(Test-Path "${{ env.PACKAGE }}/lib/MNN.dll")) {
                    throw "Missing MNN.dll"
                  }
                  if (!(Test-Path "${{ env.PACKAGE }}/lib/MNN.lib")) {
                    throw "Missing MNN import library"
                  }

                  if (Test-Path LICENSE) {
                    Copy-Item LICENSE "${{ env.PACKAGE }}/licenses/MNN-LICENSE.txt"
                  }

                  @"
                  {
                    "name": "MNN",
                    "version": "${{ needs.setup.outputs.VERSION }}",
                    "checkout_ref": "${{ needs.setup.outputs.CHECKOUT_REF }}",
                    "commit": "${{ github.sha }}",
                    "target": "windows-x86_64",
                    "arch": "x86_64",
                    "os": "windows",
                    "linkage": ["dynamic"],
                    "separate_build": false,
                    "backends": ["cpu", "opencl", "vulkan"],
                    "features": ["llm", "llm-omni", "vision", "audio", "bf16"],
                    "runtime": "MT",
                    "cmake": {
                      "MNN_BUILD_SHARED_LIBS": "ON",
                      "MNN_SEP_BUILD": "OFF",
                      "MNN_BUILD_LLM": "ON",
                      "MNN_BUILD_LLM_OMNI": "ON"
                    }
                  }
                  "@ | Out-File -Encoding utf8 "${{ env.PACKAGE }}/metadata.json"

                  Write-Host "Packaged libraries:"
                  Get-ChildItem "${{ env.PACKAGE }}/lib"

                  Compress-Archive -Path "${{ env.PACKAGE }}" -DestinationPath "${{ env.PACKAGE }}.zip" -Force

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.PACKAGE }}
                  path: ${{ env.PACKAGE }}.zip

    macos-universal:
        needs: [setup]
        runs-on: macos-latest
        env:
            PACKAGE: mnn-${{ needs.setup.outputs.VERSION }}-macos-universal
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  ref: ${{ needs.setup.outputs.CHECKOUT_REF }}

            - name: Setup Vulkan SDK
              uses: humbletim/setup-vulkan-sdk@v1.2.1
              with:
                  vulkan-query-version: "1.4.350.0"
                  vulkan-use-cache: true

            - name: Build dynamic arm64
              run: |
                  cmake -S . -B build-dynamic-arm64 -G Ninja \
                    ${{ env.BASE_CMAKE_ARGS }} \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DMNN_BUILD_SHARED_LIBS=ON \
                    -DMNN_USE_SSE=OFF \
                    -DMNN_METAL=ON \
                    -DMNN_ARM82=ON \
                    -DCMAKE_OSX_ARCHITECTURES=arm64

                  cmake --build build-dynamic-arm64 --config Release --parallel

            - name: Build dynamic x86_64
              run: |
                  cmake -S . -B build-dynamic-x64 -G Ninja \
                    ${{ env.BASE_CMAKE_ARGS }} \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DMNN_BUILD_SHARED_LIBS=ON \
                    -DMNN_USE_SSE=ON \
                    -DMNN_METAL=ON \
                    -DCMAKE_OSX_ARCHITECTURES=x86_64

                  cmake --build build-dynamic-x64 --config Release --parallel

            - name: Create universal binaries and package
              shell: bash
              run: |
                  set -euxo pipefail

                  mkdir -p "${PACKAGE}/lib" "${PACKAGE}/include" "${PACKAGE}/licenses"

                  lipo -create \
                    build-dynamic-arm64/libMNN.dylib \
                    build-dynamic-x64/libMNN.dylib \
                    -output "${PACKAGE}/lib/libMNN.dylib"

                  # MNN_SEP_BUILD=OFF may not emit separate libllm / MNN_Express dylibs.
                  # Package them if both architectures exist, but do not fail if absent.
                  if [[ -f build-dynamic-arm64/libllm.dylib && -f build-dynamic-x64/libllm.dylib ]]; then
                    lipo -create \
                      build-dynamic-arm64/libllm.dylib \
                      build-dynamic-x64/libllm.dylib \
                      -output "${PACKAGE}/lib/libllm.dylib"
                  fi

                  if [[ -f build-dynamic-arm64/libMNN_Express.dylib && -f build-dynamic-x64/libMNN_Express.dylib ]]; then
                    lipo -create \
                      build-dynamic-arm64/libMNN_Express.dylib \
                      build-dynamic-x64/libMNN_Express.dylib \
                      -output "${PACKAGE}/lib/libMNN_Express.dylib"
                  fi

                  cp -r include/MNN "${PACKAGE}/include/"

                  if [[ -d transformers/llm/engine/include/llm ]]; then
                    mkdir -p "${PACKAGE}/include/MNN"
                    cp -r transformers/llm/engine/include/llm "${PACKAGE}/include/MNN/"
                  fi

                  test -f "${PACKAGE}/include/MNN/llm/llm.hpp"
                  test -f "${PACKAGE}/lib/libMNN.dylib"

                  if [[ -f LICENSE ]]; then
                    cp LICENSE "${PACKAGE}/licenses/MNN-LICENSE.txt"
                  fi

                  cat > "${PACKAGE}/metadata.json" <<EOF
                  {
                    "name": "MNN",
                    "version": "${{ needs.setup.outputs.VERSION }}",
                    "checkout_ref": "${{ needs.setup.outputs.CHECKOUT_REF }}",
                    "commit": "${{ github.sha }}",
                    "target": "macos-universal",
                    "arch": ["x86_64", "arm64"],
                    "os": "macos",
                    "linkage": ["dynamic"],
                    "separate_build": false,
                    "backends": ["cpu", "opencl", "metal", "vulkan"],
                    "features": ["llm", "llm-omni", "vision", "audio", "bf16"],
                    "cmake": {
                      "MNN_BUILD_SHARED_LIBS": "ON",
                      "MNN_SEP_BUILD": "OFF",
                      "MNN_BUILD_LLM": "ON",
                      "MNN_BUILD_LLM_OMNI": "ON"
                    }
                  }
                  EOF

                  echo "Packaged libraries:"
                  find "${PACKAGE}/lib" -maxdepth 1 -type f -print

                  echo "Dynamic library dependencies:"
                  otool -L "${PACKAGE}/lib/libMNN.dylib" || true
                  if [[ -f "${PACKAGE}/lib/libllm.dylib" ]]; then
                    otool -L "${PACKAGE}/lib/libllm.dylib" || true
                  fi
                  if [[ -f "${PACKAGE}/lib/libMNN_Express.dylib" ]]; then
                    otool -L "${PACKAGE}/lib/libMNN_Express.dylib" || true
                  fi

                  tar czf "${PACKAGE}.tar.gz" "${PACKAGE}"

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.PACKAGE }}
                  path: ${{ env.PACKAGE }}.tar.gz

    release:
        needs:
            - setup
            - linux-x86_64
            - linux-aarch64
            - windows-x86_64
            - macos-universal
        if: ${{ needs.setup.outputs.IS_RELEASE == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: List artifacts
              run: |
                  ls -lh artifacts/

            - name: Generate checksums
              run: |
                  cd artifacts
                  sha256sum * > checksums.txt
                  cat checksums.txt

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.setup.outputs.VERSION }}
                  name: MNN Prebuilts ${{ needs.setup.outputs.VERSION }}
                  body: |
                      Prebuilt MNN ${{ needs.setup.outputs.VERSION }} dynamic libraries for LLM and Omni multimodal inference.

                      Built from ref: `${{ needs.setup.outputs.CHECKOUT_REF }}`
                      Commit: `${{ github.sha }}`

                      ## Downloads

                      | Artifact | OS | Arch | Archive | Backends | Highlights |
                      |----------|----|------|---------|----------|------------|
                      | `mnn-${{ needs.setup.outputs.VERSION }}-linux-x86_64` | Linux | x86_64 | `.tar.gz` | CPU + OpenCL + Vulkan | SSE, LLM, Omni, Vision, Audio, BF16 |
                      | `mnn-${{ needs.setup.outputs.VERSION }}-linux-aarch64` | Linux | aarch64 | `.tar.gz` | CPU + OpenCL + Vulkan | ARM82, LLM, Omni, Vision, Audio, BF16 |
                      | `mnn-${{ needs.setup.outputs.VERSION }}-windows-x86_64` | Windows | x86_64 | `.zip` | CPU + OpenCL + Vulkan | MSVC MT runtime, SSE, LLM, Omni, Vision, Audio, BF16 |
                      | `mnn-${{ needs.setup.outputs.VERSION }}-macos-universal` | macOS | x86_64 + arm64 | `.tar.gz` | CPU + OpenCL + Metal + Vulkan | Universal binary, ARM82 on arm64, LLM, Omni, Vision, Audio, BF16 |

                      `checksums.txt` contains SHA-256 checksums for all uploaded artifacts.

                      ## Package contents

                      Each package contains:

                      - `lib/` — dynamic MNN runtime libraries
                          - Linux: `libMNN.so` and optional `libllm.so` / `libMNN_Express.so` if emitted by the build
                          - macOS: `libMNN.dylib` and optional `libllm.dylib` / `libMNN_Express.dylib` if emitted by both arch builds
                          - Windows: `MNN.dll` + `MNN.lib` and optional `llm` / `MNN_Express` DLL/import libraries if emitted by the build
                      - `include/MNN/` — public MNN headers plus LLM headers
                      - `licenses/`
                      - `metadata.json` — target, backend, feature, and CMake option metadata

                      ## Build configuration

                      - Dynamic-library build: `MNN_BUILD_SHARED_LIBS=ON`.
                      - Unified build: `MNN_SEP_BUILD=OFF`; LLM / Omni components may be linked into the main MNN dynamic library instead of separate `libllm` / `MNN_Express` libraries.
                      - LLM and multimodal support: `MNN_BUILD_LLM=ON`, `MNN_BUILD_LLM_OMNI=ON`.
                      - Vision/audio support: `MNN_BUILD_OPENCV=ON`, `MNN_IMGCODECS=ON`, `MNN_BUILD_AUDIO=ON`.
                      - Runtime optimizations: `MNN_LOW_MEMORY=ON`, `MNN_SUPPORT_TRANSFORMER_FUSE=ON`, `MNN_SUPPORT_BF16=ON`, `MNN_CPU_WEIGHT_DEQUANT_GEMM=ON`.
                      - GPU backends: `MNN_OPENCL=ON`, `MNN_VULKAN=ON`; macOS additionally enables `MNN_METAL=ON`.
                      - Tools, demos, tests, benchmarks, quant tools, and converter are disabled to keep packages small.

                      ## Notes

                      - Dynamic libraries may require system GPU runtime libraries at runtime.
                      - Linux aarch64 and macOS arm64 builds enable `MNN_ARM82=ON`; x86_64 builds enable `MNN_USE_SSE=ON`.
                      - Windows prebuilts are built with `MNN_WIN_RUNTIME_MT=ON`.
                      - macOS OpenCL is deprecated by Apple but still available as a framework on current macOS SDKs.
                  files: artifacts/*
                  draft: false
